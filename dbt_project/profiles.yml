# dbt profile for DuckDB.
# dbt-duckdb resolves this path relative to the CURRENT WORKING DIRECTORY,
# so always run dbt from the repo root:
#   dbt run --project-dir dbt_project --profiles-dir dbt_project
project_on_rails:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: data/warehouse.duckdb
      threads: 4
