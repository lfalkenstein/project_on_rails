[project]
name = "project-on-rails"
version = "0.1.0"
description = "Learning project: Deutsche Bahn / BVG transit data with Python, DuckDB, and dbt"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "dbt-duckdb>=1.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]
